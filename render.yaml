services:
  - type: web
    name: hizlicevap
    runtime: static
    buildCommand: test -f public/index.html
    staticPublishPath: ./public
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
